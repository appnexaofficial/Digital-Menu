<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0"
    >

    <title>SaladVerse - Build Your Own Bowl</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .tv-screen {
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            background: #000;
        }

        .menu-image {
            width: 100vh;
            height: 100vw;

            display: block;

            object-fit: fill;

            transform: rotate(90deg);

            flex-shrink: 0;
        }

    </style>

</head>

<body>

    <div class="tv-screen">

        <img
            class="menu-image"
            src="menu3-build-your-bowl.png"
            alt="SaladVerse Build Your Own Bowl Menu"
        >

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SaladVerse | Share Your Experience</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f3fff5, #ffffff);
      color: #18351f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 82px;
      border-radius: 22px;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #777;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .question {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 25px;
    }

    .star {
      border: none;
      background: transparent;
      font-size: 40px;
      cursor: pointer;
      color: #d7d7d7;
      transition: 0.2s;
      padding: 0;
    }

    .star:hover,
    .star.active {
      color: #f6b800;
      transform: scale(1.08);
    }

    .rating-text {
      min-height: 22px;
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
    }

    .feedback-box {
      display: none;
      text-align: left;
      margin-top: 10px;
    }

    .feedback-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .feedback {
      background: #f6faf7;
      border: 1px solid #e3eee5;
      border-radius: 15px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #304236;
      margin-bottom: 12px;
    }

    .copy-btn {
      width: 100%;
      border: none;
      background: #18351f;
      color: white;
      padding: 14px;
      border-radius: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .copy-btn:hover {
      opacity: 0.9;
    }

    .google-btn,
    .instagram-btn,
    .direction-btn {
      display: block;
      width: 100%;
      text-decoration: none;
      padding: 14px;
      border-radius: 13px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      transition: 0.2s;
    }

    .google-btn {
      background: #fbbc05;
      color: #222;
    }

    .instagram-btn {
      background: #e1306c;
      color: white;
    }

    .direction-btn {
      background: #eef5ef;
      color: #18351f;
    }

    .google-btn:hover,
    .instagram-btn:hover,
    .direction-btn:hover {
      transform: translateY(-1px);
    }

    .social-section {
      border-top: 1px solid #eee;
      margin-top: 25px;
      padding-top: 22px;
    }

    .social-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .social-subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 13px;
    }

    .footer {
      margin-top: 22px;
      font-size: 11px;
      color: #aaa;
    }

    .success {
      color: #27833c;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      min-height: 18px;
    }

    @media (max-width: 380px) {
      .container {
        padding: 25px 18px;
      }

      .star {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- SaladVerse Logo -->
    <img
      src="saladverse-logo.jpeg"
      alt="SaladVerse"
      class="logo"
    />

    <div class="brand">SaladVerse</div>

    <div class="subtitle">
      Fresh • Healthy • Delicious
    </div>

    <div class="question">
      How was your experience?
    </div>

    <!-- Stars -->
    <div class="stars">

      <button class="star" data-rating="1">★</button>
      <button class="star" data-rating="2">★</button>
      <button class="star" data-rating="3">★</button>
      <button class="star" data-rating="4">★</button>
      <button class="star" data-rating="5">★</button>

    </div>

    <div class="rating-text" id="ratingText">
      Select your rating
    </div>

    <!-- Feedback -->
    <div class="feedback-box" id="feedbackBox">

      <div class="feedback-title">
        ✨ Suggested feedback
      </div>

      <div class="feedback" id="feedbackText"></div>

      <div class="success" id="copyStatus"></div>

      <button class="copy-btn" onclick="copyFeedback()">
        📋 Copy Feedback
      </button>

      <a
        id="googleButton"
        class="google-btn"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        ⭐ Review SaladVerse on Google
      </a>

    </div>

    <!-- Social -->
    <div class="social-section">

      <div class="social-title">
        📸 Stay Connected
      </div>

      <div class="social-subtitle">
        Follow SaladVerse on Instagram
      </div>

      <a
        class="instagram-btn"
        href="https://www.instagram.com/saladversemathura/"
        target="_blank"
        rel="noopener noreferrer"
      >
        📸 Follow us on Instagram
      </a>

      <a
        class="direction-btn"
        href="https://www.google.com/maps/dir//Saladverse,+shop+No.+14,+Moti+Manzil,+NH-2,+Krishna+Nagar,+Mathura,+Uttar+Pradesh+281001/@27.5021824,77.6667136,13z/data=!3m1!4b1!4m8!4m7!1m0!1m5!1m1!1s0x397371d3db74145f:0x8acfebffff6ac37a!2m2!1d77.6551337!2d27.4936007?entry=ttu&g_ep=EgoyMDI2MDkyOC4wIKXMDSoASAFQAw%3D%3D"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍 Get Directions
      </a>

    </div>

    <div class="footer">
      Thank you for visiting SaladVerse ❤️
    </div>

  </div>


  <script>

    /*
      ==========================================
      SALADVERSE CONFIGURATION
      ==========================================
    */

    const GOOGLE_REVIEW_URL =
      "https://g.page/r/CXrDav__68-KEBM/review";


    /*
      ==========================================
      FEEDBACK TEMPLATES
      ==========================================
    */

    const feedbacks = {

      1: [
        "I had a disappointing experience at SaladVerse. There are several areas that could be improved, especially the overall service and experience."
      ],

      2: [
        "My experience at SaladVerse was okay, but there is definitely room for improvement. I hope to see better service and experience on my next visit."
      ],

      3: [
        "Overall, my experience at SaladVerse was decent. The food was good, although there are a few areas that could be improved."
      ],

      4: [
        "Had a great experience at SaladVerse! The food was fresh, the service was good, and I really enjoyed my visit."
      ],

      5: [
        "Had a wonderful experience at SaladVerse! The food was fresh and delicious, the presentation was great, and the overall experience was excellent. Would definitely visit again!"
      ]

    };


    /*
      ==========================================
      VARIABLES
      ==========================================
    */

    let selectedRating = 0;
    let selectedFeedback = "";


    /*
      ==========================================
      STAR ELEMENTS
      ==========================================
    */

    const stars = document.querySelectorAll(".star");

    const ratingText =
      document.getElementById("ratingText");

    const feedbackBox =
      document.getElementById("feedbackBox");

    const feedbackText =
      document.getElementById("feedbackText");

    const googleButton =
      document.getElementById("googleButton");

    const copyStatus =
      document.getElementById("copyStatus");


    /*
      ==========================================
      STAR CLICK
      ==========================================
    */

    stars.forEach(star => {

      star.addEventListener("click", () => {

        selectedRating =
          Number(star.dataset.rating);

        updateStars();

        generateFeedback();

        saveFeedback();

      });

    });


    /*
      ==========================================
      UPDATE STARS
      ==========================================
    */

    function updateStars() {

      stars.forEach(star => {

        const rating =
          Number(star.dataset.rating);

        if (rating <= selectedRating) {

          star.classList.add("active");

        } else {

          star.classList.remove("active");

        }

      });


      const ratingMessages = {

        1: "We're sorry to hear that 😔",
        2: "We'll try to do better 🙏",
        3: "Thanks for your feedback 🙂",
        4: "Glad you enjoyed it! 😊",
        5: "We're happy you loved it! ❤️"

      };

      ratingText.textContent =
        ratingMessages[selectedRating];

    }


    /*
      ==========================================
      GENERATE FEEDBACK
      ==========================================
    */

    function generateFeedback() {

      const options =
        feedbacks[selectedRating];

      const randomIndex =
        Math.floor(Math.random() * options.length);

      selectedFeedback =
        options[randomIndex];

      feedbackText.textContent =
        selectedFeedback;

      feedbackBox.style.display =
        "block";

      copyStatus.textContent = "";

      /*
        Google Review button
      */

      googleButton.href =
        GOOGLE_REVIEW_URL;

    }


    /*
      ==========================================
      COPY FEEDBACK
      ==========================================
    */

    async function copyFeedback() {

      try {

        await navigator.clipboard.writeText(
          selectedFeedback
        );

        copyStatus.textContent =
          "✓ Feedback copied! Now paste it on Google.";

      } catch (error) {

        const textarea =
          document.createElement("textarea");

        textarea.value =
          selectedFeedback;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        copyStatus.textContent =
          "✓ Feedback copied!";

      }

    }


    /*
      ==========================================
      BASIC ANALYTICS
      ==========================================
    */

    function saveFeedback() {

      const oldData =
        JSON.parse(
          localStorage.getItem(
            "saladverse_feedback"
          ) || "[]"
        );

      oldData.push({

        rating: selectedRating,

        feedback: selectedFeedback,

        time: new Date().toISOString()

      });

      localStorage.setItem(
        "saladverse_feedback",
        JSON.stringify(oldData)
      );

    }

  </script>

</body>
</html>

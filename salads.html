<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaladVerse - Salads</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .menu-screen {
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #000;
    }

    .menu-image {
      width: 100%;
      height: 100%;

      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

  <div class="menu-screen">
    <img
      class="menu-image"
      src="menu2-salads.png"
      alt="SaladVerse Salads Menu"
    >
  </div>

</body>
</html>
